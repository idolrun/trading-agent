[project]
name = "trading-agent-backend"
version = "0.1.0"
description = "Discord signal copy-trading assistant backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "exchange-calendars>=4.13.2",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pywebpush>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlmodel>=0.0.47",
    "typesafe-sdk>=0.7.2",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # fixed SQL in schema tests
"migrations/versions/*" = ["E501"]  # autogenerated CHECK lists

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "pywebpush"]
ignore_missing_imports = true  # ships no type information

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: calls real model APIs (needs keys); run with -m live",
    "integration: needs PostgreSQL (docker compose up -d postgres)",
    "graph: LangGraph workflow tests",
    "load: load / fault tests",
]
